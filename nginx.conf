events { 
    worker_connections 1024; 
}

http {
    # Define the group of game servers
    upstream game_cluster {
        # CRITICAL: This ensures players rejoin the SAME server (Sticky Session)
        # unless that server is down.
        hash $arg_gameId consistent;

        server game-server-1:3000 max_fails=3 fail_timeout=5s;
        server game-server-2:3000 max_fails=3 fail_timeout=5s;
    }

    server {
        # We listen on port 3000 to mimic your original API
        listen 3000;

        location / {
            proxy_pass http://game_cluster;

            # WebSocket Support (Required for Socket.IO)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            # Pass header information so the backend knows the real IP
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Timeouts: If a server dies, fail over quickly
            proxy_connect_timeout 2s;
            proxy_read_timeout 60s;
        }
    }
}