services:
  # the actual db
  gameplay-mongo:
    image: mongo
    container_name: gameplay-mongodb-container
    restart: always
    volumes:
      - ./import:/docker-entrypoint-initdb.d:ro
    networks:
      - gameplay-internal-net

  # the management interface to the db 
  gameplay-mongo-express:
    depends_on:
      - gameplay-mongo
    image: mongo-express
    restart: always
    ports:
      # for development purposes only
      - ${GAMEPLAY_DB_UI_PORT:-8083}:8081
    networks:
      - gameplay-internal-net 
    environment:
      ME_CONFIG_MONGODB_SERVER: gameplay-mongodb-container
      # TODO: use auth to access this or remove entirely on deploy
      ME_CONFIG_BASICAUTH: false

  # the api built on top of the db
  gameplay-frontend:
    build: .
    container_name: gameplay-api
    depends_on:
      - gameplay-mongo
    ports:
      - ${GAMEPLAY_API_PORT}:3000
    networks:
      - gameplay-internal-net
      - town-of-saviom-shared-net
    environment:
      # gameplay-mongodb-container -> nome container del db
      # games -> nome del db
      - MONGO_URI=mongodb://gameplay-mongodb-container:27017/games
      # production or debug
      - NODE_ENV=${NODE_ENV}
      # auth-service container url
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
      # origin url accepted by cors
      - CORS_ORIGIN=${CORS_ORIGIN}
      # stats-service conatiner url
      - STATS_SERVICE_URL=${STATS_SERVICE_URL}
      # info for internal network use
      # my credentials to call the stats-service and lobby credentials to check for games start
      - GAMEPLAY_X_INTERNAL_SERVICE_ID=${GAMEPLAY_X_INTERNAL_SERVICE_ID}
      - LOBBY_X_INTERNAL_SERVICE_ID=${LOBBY_X_INTERNAL_SERVICE_ID}
      - X_INTERNAL_SECRET=${X_INTERNAL_SECRET}

networks:
  gameplay-internal-net:
    driver: bridge
  town-of-saviom-shared-net:
    external: true